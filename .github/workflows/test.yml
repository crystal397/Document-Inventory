# GitHub Actions CI — push / Pull Request 때마다 GitHub 서버에서 자동으로 테스트를 실행한다.
# macOS 실기기 테스트를 하지 않기로 했으므로, macOS 동작 검증은 이 CI가 담당한다.
# 업로드되는 것은 저장소의 코드뿐이며, 테스트는 가상 데이터만 사용한다.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # matrix: 아래 조합(OS 2개 × Python 2개 = 4개)을 각각 별도의 가상머신에서 실행
    strategy:
      fail-fast: false  # 하나가 실패해도 나머지 조합은 끝까지 실행 (어느 OS 문제인지 파악용)
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]  # 지원 최저 버전 + 개발 버전

    runs-on: ${{ matrix.os }}

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v5

      - name: Python ${{ matrix.python-version }} 설치
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 패키지 + 개발 도구 설치
        run: python -m pip install -e ".[dev]"

      - name: 린트 검사 (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: 테스트 실행 (pytest + coverage)
        run: python -m pytest --cov --cov-report=term-missing
